# RWA Exchange 生产部署（单机起步版）
# 用法：cp .env.example .env && 编辑 .env 后 docker compose up -d --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      ETH_RPC_URL: ${ETH_RPC_URL:-http://host.docker.internal:8545}
      ETH_PRIVATE_KEY: ${ETH_PRIVATE_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - backend-data:/app/data
    expose:
      - "8080"
    networks: [rwa]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    expose:
      - "3000"
    networks: [rwa]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks: [rwa]

volumes:
  backend-data:

networks:
  rwa:
